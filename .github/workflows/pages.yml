# Builds the app and publishes it, with the landing page in site/, to GitHub Pages on every push to main.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The collaboration server's address (a repository variable, not a secret). Without it, sharing is hidden.
          VITE_COLLAB_URL: ${{ vars.VITE_COLLAB_URL }}
      # The landing page sits at the root of the site and the app itself under /app/.
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r dist _site/app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
